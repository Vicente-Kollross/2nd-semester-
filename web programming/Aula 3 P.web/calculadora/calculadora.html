<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="caixa">
    <div class="cabecalho">
        <h1>Calculadora</h1>
        <button type="button" id="limpar" class="botao-limpar">Limpar</button>
    </div>

    <label for="valor1">Primeiro valor</label>
    <input type="number" id="valor1" />

    <label for="valor2">Segundo valor</label>
    <input type="number" id="valor2" />

    <button type="button" id="somar">Somar</button>
    <button type="button" id="subtrair">Subtrair</button>
    <button type="button" id="multiplicar">Multiplicar</button>
    <button type="button" id="dividir">Dividir</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
